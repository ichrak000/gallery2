<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>

  <style>
    body {
      background-color: black;
    }

    #image {
      width: 300px;
      height: 200px;
      border: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      background-size: cover;
      background-position: center;
      margin-bottom: 16px;
      color: white;
    }

    .preview {
      width: 150px;
      margin: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div
    id="image"
    role="img"
    aria-label="Image preview area"
  >
    Hover over an image below to display here
  </div>

  <section aria-label="Electric guitar gallery">

    <img
      src="data:image/jpeg;base64,..."
      alt="Electric guitar"
      class="preview"
    >

    <img
      src="data:image/jpeg;base64,..."
      alt="Metallica electric guitar"
      class="preview"
    >

    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTExlExNSSpahRxiJ3fUqp-Mhl9Gmqz4TMVgw&s"
      alt="Sepultura electric guitar"
      class="preview"
    >

    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR3huh-Gk_tYXft4jqyTbAgss7DIyh_bu3KSg&s"
      alt="Red electric guitar"
      class="preview"
    >

    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRjHPYw6gB4SgXb07N7z-KHsMwrANHokDwBrA&s"
      alt="Smooth electric guitar"
      class="preview"
    >

  </section>

</body>
</html>
